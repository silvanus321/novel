<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quadrama - 四軌視覺敘事引擎</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        /* 人物幾何形狀 */
        .shape-char { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; font-weight: bold; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; transition: all 0.3s ease; user-select: none; }
        .shape-char:hover { transform: translate(-50%, -50%) scale(1.15); z-index: 30 !important; filter: brightness(1.2); }
        .align-good { border-radius: 8px; background: linear-gradient(135deg, #0ea5e9, #0284c7); border: 2px solid #7dd3fc; color: white; }
        .align-evil { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; align-items: flex-end; padding-bottom: 15%; }
        .align-neutral { border-radius: 50%; background: linear-gradient(135deg, #64748b, #475569); border: 2px solid #cbd5e1; color: white; }
        .size-main { width: 70px; height: 70px; font-size: 14px; z-index: 20; }
        .size-sub { width: 50px; height: 50px; font-size: 11px; z-index: 15; }
        .size-extra { width: 35px; height: 35px; font-size: 9px; z-index: 10; }

        /* 心智圖連線 */
        #mindmap-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .relation-line { stroke: #64748b; stroke-width: 2; opacity: 0.5; }
        .relation-text-bg { fill: #0f172a; fill-opacity: 0.9; rx: 4; }
        .relation-text { fill: #38bdf8; font-size: 10px; text-anchor: middle; dominant-baseline: central; }

        /* 地點彈性方塊 */
        .loc-box { flex: 1 1 auto; max-width: 120px; min-width: 60px; aspect-ratio: 1/1; transition: all 0.2s; border-radius: 12px; }
        .loc-box:hover { filter: brightness(1.2); transform: translateY(-2px); cursor: pointer; }
        .loc-box.selected-for-group { border: 3px dashed #fcd34d !important; transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans h-screen overflow-hidden flex flex-col">

    <!-- ==================== 首頁大廳 ==================== -->
    <div id="screen-home" class="h-full flex flex-col items-center justify-center p-6 animate-fade-in z-50 absolute inset-0 bg-slate-950">
        <div class="text-center mb-12">
            <h1 class="text-6xl font-bold tracking-widest text-white mb-3">Quad<span class="text-cyan-500">rama.</span></h1>
            <p class="text-slate-500 text-sm">四軌視覺敘事引擎</p>
        </div>
        <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
                <h2 class="text-xl font-bold text-white">故事 Story</h2>
                <button onclick="createNewProject()" class="w-10 h-10 rounded-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xl flex items-center justify-center transition-transform hover:scale-110 shadow-[0_0_15px_rgba(8,145,178,0.5)]">+</button>
            </div>
            <div id="story-list" class="space-y-3 max-h-[50vh] overflow-y-auto pr-2 hide-scroll"></div>
        </div>
    </div>

    <!-- ==================== 四軌工作站 ==================== -->
    <div id="screen-workspace" class="hidden h-full flex-col bg-slate-950">
        
        <header class="h-12 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 shrink-0">
            <div class="flex items-center gap-4">
                <button onclick="backToHome()" class="text-slate-400 hover:text-white text-xs bg-slate-800 px-3 py-1.5 rounded transition-colors">◀ 返回</button>
                <h1 class="text-sm font-bold text-white" id="workspace-title">故事名稱</h1>
            </div>
            <div id="breadcrumb-container" class="flex text-xs items-center gap-2 overflow-x-auto hide-scroll"></div>
        </header>

        <div class="flex-1 flex flex-col overflow-hidden">
            
            <!-- 軌道 1：時間軸 15% height -->
            <div class="h-[15%] bg-slate-900 border-b border-slate-800 p-3 flex flex-col">
                <div class="flex justify-between items-center mb-2 shrink-0">
                    <span class="text-xs font-bold text-cyan-400">1. 時間軸 (Time)</span>
                    <div class="flex gap-2">
                        <select id="timeScale" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-[10px] text-white outline-none">
                            <option value="hour">1 小時</option><option value="day">1 天</option><option value="month">1 個月</option>
                            <option value="year" selected>1 年</option><option value="decade">10 年</option><option value="century">100 年</option>
                            <option value="epoch">10000 年</option>
                        </select>
                        <input type="text" id="timeRange" placeholder="指定區間 (例: 1年1月 12:00)" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-[10px] text-white outline-none w-40">
                        <button onclick="saveTimeRange()" class="bg-cyan-600 text-white px-2 py-1 rounded text-[10px]">綁定至本卡片</button>
                    </div>
                </div>
                <div class="flex-1 bg-slate-950 rounded-lg border border-slate-800 relative overflow-hidden flex items-center px-4">
                    <div class="w-full h-0.5 bg-cyan-900/50 relative">
                        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-cyan-500 text-[9px] px-2 py-0.5 rounded text-white font-bold" id="currentTimeLabel">未指定時間</div>
                    </div>
                </div>
            </div>

            <!-- 軌道 2：劇情方塊 45% height -->
            <div class="h-[45%] bg-slate-950 border-b border-slate-800 p-4 flex flex-col items-center justify-center relative">
                <div class="absolute top-3 left-4 text-xs font-bold text-white">2. 劇情方塊 (Story)</div>
                <button onclick="zoomOut()" id="btnZoomOut" class="absolute top-3 right-4 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-3 py-1 rounded text-xs hidden shadow-lg">↑ 回上層</button>

                <div class="w-full max-w-4xl h-full grid grid-cols-2 grid-rows-2 gap-3 pt-6 pb-2">
                    <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex flex-col relative group">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[11px] font-bold text-cyan-400">起 (Hook)</span>
                            <button onclick="zoomIn('hook')" class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-cyan-500 hover:bg-cyan-900">↘ 鑽入</button>
                        </div>
                        <textarea id="val-hook" onchange="autoSaveText()" class="flex-1 bg-transparent text-sm text-slate-300 resize-none outline-none hide-scroll" placeholder="環境與動機..."></textarea>
                    </div>
                    <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex flex-col relative group">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[11px] font-bold text-emerald-400">承 (Develop)</span>
                            <button onclick="zoomIn('develop')" class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-emerald-500 hover:bg-emerald-900">↘ 鑽入</button>
                        </div>
                        <textarea id="val-develop" onchange="autoSaveText()" class="flex-1 bg-transparent text-sm text-slate-300 resize-none outline-none hide-scroll" placeholder="互動與推進..."></textarea>
                    </div>
                    <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex flex-col relative group">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[11px] font-bold text-rose-400">合 (Resolution)</span>
                            <button onclick="zoomIn('resolution')" class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-rose-500 hover:bg-rose-900">↘ 鑽入</button>
                        </div>
                        <textarea id="val-resolution" onchange="autoSaveText()" class="flex-1 bg-transparent text-sm text-slate-300 resize-none outline-none hide-scroll" placeholder="收尾與懸念..."></textarea>
                    </div>
                    <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex flex-col relative group">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[11px] font-bold text-amber-400">轉 (Twist)</span>
                            <button onclick="zoomIn('twist')" class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-amber-500 hover:bg-amber-900">↘ 鑽入</button>
                        </div>
                        <textarea id="val-twist" onchange="autoSaveText()" class="flex-1 bg-transparent text-sm text-slate-300 resize-none outline-none hide-scroll" placeholder="衝突與轉折..."></textarea>
                    </div>
                </div>
            </div>

            <!-- 軌道 3：人物關係圖 25% height -->
            <div class="h-[25%] bg-slate-900 border-b border-slate-800 p-3 flex flex-col relative overflow-hidden">
                <div class="flex justify-between items-center mb-2 shrink-0 z-10 relative">
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold text-amber-400">3. 人物維基 (Characters)</span>
                        <span class="text-[10px] text-slate-500">單擊綁定劇情卡 / 雙擊查看詳細資料</span>
                    </div>
                    <button onclick="openCharAddModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded text-[10px] border border-slate-600">+ 新增人物/關係</button>
                </div>
                <div class="flex-1 relative w-full" id="mindmap-container">
                    <svg id="mindmap-svg"></svg>
                </div>
            </div>

            <!-- 軌道 4：地點軸 15% height -->
            <div class="h-[15%] bg-slate-950 p-3 flex flex-col relative">
                <div class="flex justify-between items-center mb-2 shrink-0 z-10">
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold text-emerald-400">4. 地點軸 (Locations)</span>
                        <span class="text-[10px] text-slate-500">單擊綁定劇情卡 / 雙擊查看詳細資料</span>
                    </div>
                    <!-- 新增：群組化模式按鈕 -->
                    <div class="flex gap-2 items-center">
                        <button id="btnGroupLoc" onclick="toggleGroupMode()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded text-[10px] border border-slate-600 transition-colors">⊞ 群組化區域</button>
                        <button id="btnConfirmGroup" onclick="createLocationGroup()" class="hidden bg-emerald-600 text-white px-2 py-1 rounded text-[10px] font-bold shadow-lg animate-pulse">合併選取區域</button>
                    </div>
                </div>
                
                <div class="flex-1 flex flex-nowrap overflow-x-auto hide-scroll gap-3 items-center px-1 pb-1" id="location-track">
                    <!-- JS 生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 彈出面板 ==================== -->
    
    <!-- 快速新增人物/關係 Modal -->
    <div id="charAddModal" class="hidden fixed inset-0 z-[100] bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg shadow-2xl p-6">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                <h3 class="text-base font-bold text-amber-400">快速建立節點</h3>
                <button onclick="closeModal('charAddModal')" class="text-slate-500 hover:text-white">✕</button>
            </div>
            <div class="space-y-4">
                <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                    <div class="flex gap-2">
                        <input type="text" id="add-charName" placeholder="角色名稱" class="flex-1 bg-slate-900 border border-slate-600 rounded px-2 py-1.5 text-xs text-white outline-none">
                        <select id="add-charAlign" class="bg-slate-900 border border-slate-600 rounded px-2 py-1.5 text-xs text-white outline-none">
                            <option value="good">正派(方)</option><option value="evil">反派(三角)</option><option value="neutral">中立(圓)</option>
                        </select>
                        <select id="add-charSize" class="bg-slate-900 border border-slate-600 rounded px-2 py-1.5 text-xs text-white outline-none">
                            <option value="main">主角(大)</option><option value="sub">配角(中)</option><option value="extra">路人(小)</option>
                        </select>
                        <button onclick="quickAddCharacter()" class="bg-amber-600 text-white px-3 py-1.5 rounded text-xs">新增</button>
                    </div>
                </div>
                <div class="bg-slate-800 p-3 rounded-lg border border-slate-700">
                    <div class="flex gap-2 items-center">
                        <select id="relCharA" class="flex-1 bg-slate-900 border border-slate-600 rounded px-2 py-1.5 text-xs text-white outline-none"></select>
                        <span class="text-xs text-slate-500">與</span>
                        <select id="relCharB" class="flex-1 bg-slate-900 border border-slate-600 rounded px-2 py-1.5 text-xs text-white outline-none"></select>
                        <input type="text" id="relLabel" placeholder="關係" class="w-16 bg-slate-900 border border-slate-600 rounded px-2 py-1.5 text-xs text-white outline-none">
                        <button onclick="quickAddRelationship()" class="bg-cyan-600 text-white px-3 py-1.5 rounded text-xs">連線</button>
                    </div>
                </div>
            </div>
            <div class="mt-4 pt-4 border-t border-slate-800 text-right">
                <button onclick="closeModal('charAddModal')" class="bg-slate-700 text-white px-4 py-2 rounded text-xs">完成</button>
            </div>
        </div>
    </div>

    <!-- 角色詳細 Wiki 面板 -->
    <div id="charProfileModal" class="hidden fixed inset-0 z-[100] bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-2xl shadow-2xl p-6 overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                <h3 class="text-lg font-bold text-amber-400">👤 角色檔案 (Wiki)</h3>
                <button onclick="closeModal('charProfileModal')" class="text-slate-500 hover:text-white">✕</button>
            </div>
            <div class="space-y-4">
                <input type="hidden" id="p-charId">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div class="col-span-2"><label class="text-[10px] text-slate-500">本名</label><input type="text" id="p-charName" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white"></div>
                    <div class="col-span-2"><label class="text-[10px] text-slate-500">外號 / 代號</label><input type="text" id="p-charAlias" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white"></div>
                    <div><label class="text-[10px] text-slate-500">年齡</label><input type="text" id="p-charAge" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white"></div>
                    <div><label class="text-[10px] text-slate-500">身高</label><input type="text" id="p-charHeight" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white"></div>
                    <div><label class="text-[10px] text-slate-500">陣營形狀</label>
                        <select id="p-charAlign" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white"><option value="good">正派</option><option value="evil">反派</option><option value="neutral">中立</option></select>
                    </div>
                    <div><label class="text-[10px] text-slate-500">階級大小</label>
                        <select id="p-charSize" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white"><option value="main">主角</option><option value="sub">配角</option><option value="extra">路人</option></select>
                    </div>
                    <div><label class="text-[10px] text-slate-500">星座</label><input type="text" id="p-charZodiac" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white"></div>
                    <div><label class="text-[10px] text-slate-500">MBTI</label><input type="text" id="p-charMbti" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white"></div>
                    <div class="col-span-2"><label class="text-[10px] text-slate-500">穿衣風格</label><input type="text" id="p-charClothing" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white"></div>
                </div>
                <div><label class="text-[10px] text-slate-500">核心特徵 (傷疤、習慣動作等)</label><textarea id="p-charTraits" class="w-full h-16 bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white resize-none"></textarea></div>
                <div><label class="text-[10px] text-slate-500">背景故事與動機</label><textarea id="p-charDesc" class="w-full h-24 bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white resize-none"></textarea></div>
                
                <div class="flex justify-between mt-4 border-t border-slate-800 pt-4">
                    <button onclick="deleteCharacterProfile()" class="bg-slate-800 hover:bg-red-900/50 text-red-400 px-3 py-2 rounded text-xs border border-slate-700">刪除角色</button>
                    <button onclick="saveCharacterProfile()" class="bg-amber-600 hover:bg-amber-500 text-white px-6 py-2 rounded text-sm font-bold">儲存檔案</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 地點詳細 Wiki 面板 -->
    <div id="locProfileModal" class="hidden fixed inset-0 z-[100] bg-slate-950/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg shadow-2xl p-6">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                <h3 class="text-lg font-bold text-emerald-400">📍 地點檔案 (Wiki)</h3>
                <button onclick="closeModal('locProfileModal')" class="text-slate-500 hover:text-white">✕</button>
            </div>
            <div class="space-y-3">
                <input type="hidden" id="p-locId">
                <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2"><label class="text-[10px] text-slate-500">地點名稱</label><input type="text" id="p-locName" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white outline-none"></div>
                    <div><label class="text-[10px] text-slate-500">所屬群組區域 (清除可解散群組)</label><input type="text" id="p-locRegion" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white outline-none" placeholder="無區域"></div>
                    <div><label class="text-[10px] text-slate-500">區域/代表底色</label><input type="color" id="p-locColor" class="w-full h-8 bg-slate-800 border border-slate-600 rounded cursor-pointer p-0.5"></div>
                    <div class="col-span-2"><label class="text-[10px] text-slate-500">範圍與地理特徵</label><input type="text" id="p-locGeo" class="w-full bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white outline-none"></div>
                    <div class="col-span-2"><label class="text-[10px] text-slate-500">功能與建物性質</label><textarea id="p-locFunc" class="w-full h-16 bg-slate-800 border border-slate-600 rounded p-1.5 text-sm text-white resize-none outline-none"></textarea></div>
                </div>
                <div class="flex justify-between mt-4 border-t border-slate-800 pt-4">
                    <button onclick="deleteLocationProfile()" class="bg-slate-800 hover:bg-red-900/50 text-red-400 px-3 py-2 rounded text-xs border border-slate-700">刪除此地點</button>
                    <button onclick="saveLocationProfile()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded text-sm font-bold">儲存檔案</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 1. Firebase 雲端設定 ====================
        const firebaseConfig = {
            apiKey: "AIzaSyAwfzJgdmllNgz_jyw_0oZ_as4SoLn1CYs",
            authDomain: "novel-462e5.firebaseapp.com",
            databaseURL: "https://novel-462e5-default-rtdb.firebaseio.com",
            projectId: "novel-462e5",
            storageBucket: "novel-462e5.firebasestorage.app",
            messagingSenderId: "730038256784",
            appId: "1:730038256784:web:976415daf4c99e1a3b0415"
        };
        
        let useCloud = false, dbRef = null;
        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            dbRef = firebase.database().ref('quadrama_v3');
            useCloud = true;
        }

        // ==================== 全域變數與狀態 ====================
        let appData = { stories: [] };
        let currentStory = null;
        let currentNodeId = 'root'; 
        let navBreadcrumbs = []; 
        const COLORS = ['#0ea5e9', '#10b981', '#f59e0b', '#8b5cf6', '#ef4444', '#64748b'];

        // 群組化模式狀態
        let isGroupingMode = false;
        let selectedForGroup = [];

        function initApp() {
            if (useCloud) {
                dbRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) appData = data;
                    if (!appData.stories) appData.stories = [];
                    upgradeData();
                    if (!currentStory) renderHome();
                    else {
                        currentStory = appData.stories.find(s => s.id === currentStory.id);
                        if(currentStory) renderWorkspace(); else backToHome();
                    }
                });
            } else {
                try { const saved = localStorage.getItem('quadrama_local_v3'); if (saved) appData = JSON.parse(saved); } catch (e) {}
                if (!appData.stories) appData.stories = [];
                upgradeData(); renderHome();
            }
        }

        function saveGlobal() {
            if (useCloud) dbRef.set(appData);
            else localStorage.setItem('quadrama_local_v3', JSON.stringify(appData));
        }

        function upgradeData() {
            appData.stories.forEach(s => {
                if(s.chars) {
                    s.chars = s.chars.map(c => ({ alias:'', age:'', height:'', zodiac:'', mbti:'', clothing:'', traits:'', desc:'', ...c }));
                }
                if(s.locs) {
                    s.locs = s.locs.map(l => ({ region:'', geo:'', func:'', desc:'', ...l }));
                }
            });
        }

        // ==================== 首頁大廳 ====================
        function renderHome() {
            const list = document.getElementById('story-list');
            list.innerHTML = '';
            if (appData.stories.length === 0) { list.innerHTML = '<div class="text-slate-600 text-sm text-center py-6">點擊右上角 + 建立第一個故事</div>'; return; }
            appData.stories.sort((a,b)=>b.updatedAt - a.updatedAt).forEach(s => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-800/50 hover:bg-slate-800 p-4 rounded-xl border border-slate-700 cursor-pointer transition-colors" onclick="openStory('${s.id}')">
                        <div><h3 class="text-white font-bold text-lg">${s.title}</h3><p class="text-[10px] text-slate-500 mt-1">最後編輯: ${new Date(s.updatedAt).toLocaleString()}</p></div>
                        <button onclick="event.stopPropagation(); deleteStory('${s.id}')" class="text-slate-600 hover:text-red-500 px-2 py-1 text-xs">刪除</button>
                    </div>`;
            });
        }
        function createNewProject() {
            const title = prompt('請輸入故事名稱：'); if (!title) return;
            const newStory = {
                id: 'story_' + Date.now(), title: title.trim(), updatedAt: Date.now(),
                chars: [], rels: [], locs: [],
                nodes: [{ id: 'root', timeConfig: { scale: 'year', range: '' }, texts: { hook:'', develop:'', twist:'', resolution:'' }, children: { hook:null, develop:null, twist:null, resolution:null }, linkedChars: [], linkedLocs: [] }]
            };
            appData.stories.push(newStory); saveGlobal(); openStory(newStory.id);
        }
        function deleteStory(id) { if (confirm("永久刪除此故事？")) { appData.stories = appData.stories.filter(s => s.id !== id); saveGlobal(); renderHome(); } }
        function openStory(id) {
            currentStory = appData.stories.find(s => s.id === id); if (!currentStory) return;
            document.getElementById('screen-home').style.display = 'none';
            document.getElementById('screen-workspace').style.display = 'flex';
            document.getElementById('workspace-title').innerText = currentStory.title;
            currentNodeId = 'root'; navBreadcrumbs = [{ id: 'root', label: '主宇宙' }];
            isGroupingMode = false; selectedForGroup = [];
            renderWorkspace();
        }
        function backToHome() { document.getElementById('screen-home').style.display = 'flex'; document.getElementById('screen-workspace').style.display = 'none'; currentStory = null; renderHome(); }

        // ==================== 工作區渲染 ====================
        function renderWorkspace() {
            if(!currentStory) return;
            renderBreadcrumbs(); renderTimelineRow(); renderStoryGrid(); renderCharacterRow(); renderLocationRow();
        }

        // --- 軌道 1：時間軸 ---
        function renderTimelineRow() {
            const node = currentStory.nodes.find(n => n.id === currentNodeId); if(!node) return;
            document.getElementById('timeScale').value = node.timeConfig.scale || 'year';
            document.getElementById('timeRange').value = node.timeConfig.range || '';
            const lbl = document.getElementById('currentTimeLabel');
            lbl.innerText = node.timeConfig.range ? node.timeConfig.range : '未綁定時間';
            lbl.className = node.timeConfig.range ? "absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-cyan-600 text-[10px] px-3 py-1 rounded-full text-white font-bold shadow-lg" : "absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-700 text-[9px] px-2 py-0.5 rounded text-slate-400";
        }
        function saveTimeRange() {
            const node = currentStory.nodes.find(n => n.id === currentNodeId);
            node.timeConfig.scale = document.getElementById('timeScale').value; node.timeConfig.range = document.getElementById('timeRange').value.trim();
            currentStory.updatedAt = Date.now(); saveGlobal(); renderTimelineRow();
        }

        // --- 軌道 2：劇情方塊 ---
        function renderStoryGrid() {
            const node = currentStory.nodes.find(n => n.id === currentNodeId); if(!node) return;
            ['hook','develop','resolution','twist'].forEach(k => document.getElementById('val-'+k).value = node.texts[k] || '');
            document.getElementById('btnZoomOut').style.display = currentNodeId === 'root' ? 'none' : 'block';
        }
        function autoSaveText() {
            const node = currentStory.nodes.find(n => n.id === currentNodeId);
            ['hook','develop','resolution','twist'].forEach(k => node.texts[k] = document.getElementById('val-'+k).value);
            currentStory.updatedAt = Date.now(); saveGlobal();
        }
        function renderBreadcrumbs() {
            document.getElementById('breadcrumb-container').innerHTML = navBreadcrumbs.map((b, i) => {
                const isLast = i === navBreadcrumbs.length - 1;
                return `<button onclick="jumpToNode(${i})" class="${isLast?'text-white font-bold':'text-slate-500 hover:text-cyan-400'} transition-colors">${b.label}</button>${!isLast?'<span class="text-slate-700 px-1">/</span>':''}`;
            }).join('');
        }
        function jumpToNode(i) { autoSaveText(); currentNodeId = navBreadcrumbs[i].id; navBreadcrumbs = navBreadcrumbs.slice(0, i + 1); renderWorkspace(); }
        function zoomIn(q) {
            autoSaveText(); const node = currentStory.nodes.find(n => n.id === currentNodeId);
            let childId = node.children[q];
            const labels = { hook:'起', develop:'承', twist:'轉', resolution:'合' };
            if (!childId) {
                childId = 'n_' + Date.now() + Math.random().toString(36).substr(2,4); node.children[q] = childId;
                currentStory.nodes.push({ id: childId, parentId: currentNodeId, timeConfig: { scale: 'day', range: '' }, texts: { hook:'', develop:'', twist:'', resolution:'' }, children: { hook:null, develop:null, twist:null, resolution:null }, linkedChars: [], linkedLocs: [] });
                saveGlobal();
            }
            currentNodeId = childId; navBreadcrumbs.push({ id: childId, label: labels[q] }); renderWorkspace();
        }
        function zoomOut() { autoSaveText(); if (navBreadcrumbs.length > 1) jumpToNode(navBreadcrumbs.length - 2); }

        // --- 軌道 3：人物關係網 ---
        function renderCharacterRow() {
            const container = document.getElementById('mindmap-container');
            const svg = document.getElementById('mindmap-svg');
            Array.from(container.children).forEach(c => { if(c.tagName !== 'svg') c.remove(); });
            svg.innerHTML = '';

            const chars = currentStory.chars || [];
            if(chars.length === 0) { container.innerHTML += '<div class="absolute inset-0 flex items-center justify-center text-slate-600 text-xs">點擊右上角新增人物</div>'; return; }

            const w = container.clientWidth || window.innerWidth, h = container.clientHeight || 200;
            const cx = w / 2, cy = h / 2, radius = Math.max(30, Math.min(cx, cy) - 40);

            chars.forEach((char, i) => {
                const el = document.createElement('div');
                let shape = char.align === 'good' ? 'align-good' : (char.align === 'evil' ? 'align-evil' : 'align-neutral');
                el.className = `shape-char ${shape} size-${char.size}`;
                el.innerText = char.name[0]; el.title = char.name; 
                
                // 單擊綁定, 雙擊編輯
                el.onclick = (e) => { if(e.detail === 1) { setTimeout(() => { if(!el.dataset.dbl) toggleLinkChar(char.id); el.dataset.dbl=''; }, 200); } };
                el.ondblclick = () => { el.dataset.dbl='1'; openCharProfileModal(char.id); };

                let x = cx, y = cy;
                if(chars.length > 1) { const angle = -Math.PI / 2 + (i / chars.length) * 2 * Math.PI; x = cx + radius * Math.cos(angle); y = cy + radius * Math.sin(angle); }
                el.style.left = `${x}px`; el.style.top = `${y}px`;
                
                const node = currentStory.nodes.find(n => n.id === currentNodeId);
                if(node && node.linkedChars.includes(char.id)) el.style.boxShadow = '0 0 0 3px #0ea5e9, 0 0 20px rgba(14,165,233,0.5)';
                container.appendChild(el);
            });

            setTimeout(() => {
                (currentStory.rels || []).forEach(rel => {
                    const cA = chars.find(c=>c.id === rel.a), cB = chars.find(c=>c.id === rel.b); if(!cA || !cB) return;
                    const domA = container.children[chars.indexOf(cA) + 1], domB = container.children[chars.indexOf(cB) + 1]; if(!domA || !domB) return;
                    const x1 = parseFloat(domA.style.left), y1 = parseFloat(domA.style.top), x2 = parseFloat(domB.style.left), y2 = parseFloat(domB.style.top);
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', x1); line.setAttribute('y1', y1); line.setAttribute('x2', x2); line.setAttribute('y2', y2);
                    line.setAttribute('class', 'relation-line'); svg.appendChild(line);
                    const mx = (x1+x2)/2, my = (y1+y2)/2, len = rel.label.length * 10 + 10;
                    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    rect.setAttribute('x', mx - len/2); rect.setAttribute('y', my - 8); rect.setAttribute('width', len); rect.setAttribute('height', 16);
                    rect.setAttribute('class', 'relation-text-bg'); svg.appendChild(rect);
                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', mx); text.setAttribute('y', my); text.setAttribute('class', 'relation-text'); text.textContent = rel.label; svg.appendChild(text);
                });
            }, 50);
        }

        // 人物 Modal 控制
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openCharAddModal() {
            const opts = (currentStory.chars||[]).map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            document.getElementById('relCharA').innerHTML = opts; document.getElementById('relCharB').innerHTML = opts;
            if((currentStory.chars||[]).length > 1) document.getElementById('relCharB').selectedIndex = 1;
            document.getElementById('charAddModal').style.display = 'flex';
        }
        function quickAddCharacter() {
            const name = document.getElementById('add-charName').value.trim();
            if(!name) return;
            if(!currentStory.chars) currentStory.chars = [];
            currentStory.chars.push({ id: 'c_'+Date.now(), name, align: document.getElementById('add-charAlign').value, size: document.getElementById('add-charSize').value, alias:'', age:'', height:'', zodiac:'', mbti:'', clothing:'', traits:'', desc:'' });
            document.getElementById('add-charName').value = ''; currentStory.updatedAt = Date.now(); saveGlobal(); renderCharacterRow(); openCharAddModal();
        }
        function quickAddRelationship() {
            const a = document.getElementById('relCharA').value, b = document.getElementById('relCharB').value, label = document.getElementById('relLabel').value.trim() || '-';
            if(!a || !b || a===b) return;
            if(!currentStory.rels) currentStory.rels = [];
            currentStory.rels.push({ a, b, label }); document.getElementById('relLabel').value = ''; currentStory.updatedAt = Date.now(); saveGlobal(); renderCharacterRow();
        }
        function toggleLinkChar(charId) {
            const node = currentStory.nodes.find(n => n.id === currentNodeId);
            if(!node.linkedChars) node.linkedChars = [];
            const idx = node.linkedChars.indexOf(charId);
            if(idx > -1) node.linkedChars.splice(idx, 1); else node.linkedChars.push(charId);
            currentStory.updatedAt = Date.now(); saveGlobal(); renderCharacterRow();
        }

        // 深度人物面板
        function openCharProfileModal(id) {
            activeCharId = id; const char = currentStory.chars.find(c => c.id === id);
            document.getElementById('p-charId').value = id;
            document.getElementById('p-charName').value = char.name || '';
            document.getElementById('p-charAlias').value = char.alias || '';
            document.getElementById('p-charAge').value = char.age || '';
            document.getElementById('p-charHeight').value = char.height || '';
            document.getElementById('p-charAlign').value = char.align || 'good';
            document.getElementById('p-charSize').value = char.size || 'main';
            document.getElementById('p-charZodiac').value = char.zodiac || '';
            document.getElementById('p-charMbti').value = char.mbti || '';
            document.getElementById('p-charClothing').value = char.clothing || '';
            document.getElementById('p-charTraits').value = char.traits || '';
            document.getElementById('p-charDesc').value = char.desc || '';
            document.getElementById('charProfileModal').style.display = 'flex';
        }
        function saveCharacterProfile() {
            const char = currentStory.chars.find(c => c.id === activeCharId);
            char.name = document.getElementById('p-charName').value.trim() || '未命名';
            char.alias = document.getElementById('p-charAlias').value.trim();
            char.age = document.getElementById('p-charAge').value.trim();
            char.height = document.getElementById('p-charHeight').value.trim();
            char.align = document.getElementById('p-charAlign').value;
            char.size = document.getElementById('p-charSize').value;
            char.zodiac = document.getElementById('p-charZodiac').value.trim();
            char.mbti = document.getElementById('p-charMbti').value.trim();
            char.clothing = document.getElementById('p-charClothing').value.trim();
            char.traits = document.getElementById('p-charTraits').value.trim();
            char.desc = document.getElementById('p-charDesc').value.trim();
            closeModal('charProfileModal'); currentStory.updatedAt = Date.now(); saveGlobal(); renderCharacterRow();
        }
        function deleteCharacterProfile() {
            if(confirm('確定刪除此角色？相關連線與綁定也會消失。')) {
                currentStory.chars = currentStory.chars.filter(c => c.id !== activeCharId);
                currentStory.rels = (currentStory.rels||[]).filter(r => r.a !== activeCharId && r.b !== activeCharId);
                currentStory.nodes.forEach(n => { n.linkedChars = (n.linkedChars||[]).filter(id => id !== activeCharId); });
                closeModal('charProfileModal'); currentStory.updatedAt = Date.now(); saveGlobal(); renderCharacterRow();
            }
        }

        // --- 軌道 4：地點軸與群組化 ---
        function toggleGroupMode() {
            isGroupingMode = !isGroupingMode;
            selectedForGroup = [];
            const btn = document.getElementById('btnGroupLoc');
            const confirmBtn = document.getElementById('btnConfirmGroup');
            if (isGroupingMode) {
                btn.classList.add('bg-cyan-600', 'text-white'); btn.classList.remove('bg-slate-800', 'text-slate-300');
                btn.innerText = '✅ 取消群組模式';
            } else {
                btn.classList.add('bg-slate-800', 'text-slate-300'); btn.classList.remove('bg-cyan-600', 'text-white');
                btn.innerText = '⊞ 群組化區域';
                confirmBtn.classList.add('hidden');
            }
            renderLocationRow();
        }

        function createLocationGroup() {
            if (selectedForGroup.length < 2) return;
            const regionName = prompt('請輸入這幾個地點所屬的區域/群組名稱：');
            if (!regionName) return;
            const regionColor = prompt('請設定此區域代表色 (HEX碼，如 #0ea5e9)：', COLORS[Math.floor(Math.random()*COLORS.length)]);
            
            selectedForGroup.forEach(locId => {
                const loc = currentStory.locs.find(l => l.id === locId);
                if(loc) { loc.region = regionName; loc.color = regionColor || loc.color; }
            });
            
            isGroupingMode = false; selectedForGroup = [];
            document.getElementById('btnGroupLoc').innerText = '⊞ 群組化區域';
            document.getElementById('btnGroupLoc').classList.add('bg-slate-800', 'text-slate-300'); document.getElementById('btnGroupLoc').classList.remove('bg-cyan-600', 'text-white');
            document.getElementById('btnConfirmGroup').classList.add('hidden');
            
            currentStory.updatedAt = Date.now(); saveGlobal(); renderLocationRow();
        }

        function handleLocClick(id) {
            if (isGroupingMode) {
                const idx = selectedForGroup.indexOf(id);
                if (idx > -1) selectedForGroup.splice(idx, 1); else selectedForGroup.push(id);
                
                const confirmBtn = document.getElementById('btnConfirmGroup');
                if(selectedForGroup.length >= 2) confirmBtn.classList.remove('hidden'); else confirmBtn.classList.add('hidden');
                renderLocationRow(); // 刷新選取外框
            } else {
                // 單擊綁定
                const node = currentStory.nodes.find(n => n.id === currentNodeId);
                if(!node.linkedLocs) node.linkedLocs = [];
                const idx = node.linkedLocs.indexOf(id);
                if(idx > -1) node.linkedLocs.splice(idx, 1); else node.linkedLocs.push(id);
                currentStory.updatedAt = Date.now(); saveGlobal(); renderLocationRow();
            }
        }

        function renderLocationRow() {
            const track = document.getElementById('location-track');
            track.innerHTML = '';
            
            const locs = currentStory.locs || [];
            
            // 整理分群
            const grouped = {}; const ungrouped = [];
            locs.forEach(l => {
                if(l.region && l.region.trim() !== '') {
                    if(!grouped[l.region]) grouped[l.region] = [];
                    grouped[l.region].push(l);
                } else { ungrouped.push(l); }
            });

            // 建立方塊 HTML 的輔助函數
            const createBox = (loc) => {
                const isSelectedGroup = isGroupingMode && selectedForGroup.includes(loc.id);
                const node = currentStory.nodes.find(n => n.id === currentNodeId);
                const isLinked = !isGroupingMode && node && node.linkedLocs && node.linkedLocs.includes(loc.id);
                
                let borderStyle = `border-color: ${loc.color};`;
                let classNames = `loc-box border flex items-center justify-center p-2 text-center relative bg-slate-900`;
                
                if(isSelectedGroup) classNames += ' selected-for-group';
                if(isLinked) borderStyle = `border-color: ${loc.color}; border-width: 2px; box-shadow: 0 0 0 3px #0ea5e9, 0 0 15px ${loc.color}80;`;

                return `<div class="${classNames}" style="${borderStyle}" onclick="handleLocClick('${loc.id}')" ondblclick="openLocProfileModal('${loc.id}')">
                    <span class="text-[10px] font-bold text-white z-10 break-words w-full" style="text-shadow: 0 1px 3px rgba(0,0,0,0.8)">${loc.name}</span>
                </div>`;
            };

            // 渲染群組
            for(const [region, items] of Object.entries(grouped)) {
                let html = `<div class="flex flex-col gap-1.5 bg-slate-900 border border-slate-700 p-2 rounded-xl shrink-0 h-full">
                    <span class="text-[10px] font-bold text-slate-400 px-1 truncate max-w-[120px]">📂 ${region}</span>
                    <div class="flex flex-1 gap-2 items-center">`;
                items.forEach(l => html += createBox(l));
                html += `</div></div>`;
                track.innerHTML += html;
            }

            // 渲染未分群
            ungrouped.forEach(l => { track.innerHTML += createBox(l); });

            // + 按鈕
            track.innerHTML += `<div onclick="addLocation()" class="loc-box border-2 dashed border-slate-700 flex items-center justify-center text-slate-500 hover:border-emerald-500 hover:text-emerald-400 bg-slate-900 shrink-0"><span class="text-2xl font-bold">+</span></div>`;
        }

        function addLocation() {
            const name = prompt('輸入新地點名稱：'); if(!name) return;
            if(!currentStory.locs) currentStory.locs = [];
            const color = COLORS[currentStory.locs.length % COLORS.length];
            currentStory.locs.push({ id: 'l_'+Date.now(), name, color, region:'', geo:'', func:'', desc:'' });
            currentStory.updatedAt = Date.now(); saveGlobal(); renderLocationRow();
        }

        // 深度地點面板
        function openLocProfileModal(id) {
            const loc = currentStory.locs.find(l => l.id === id);
            document.getElementById('p-locId').value = id;
            document.getElementById('p-locName').value = loc.name;
            document.getElementById('p-locRegion').value = loc.region || '';
            document.getElementById('p-locColor').value = loc.color || DEFAULT_COLOR;
            document.getElementById('p-locGeo').value = loc.geo || '';
            document.getElementById('p-locFunc').value = loc.func || '';
            document.getElementById('locProfileModal').style.display = 'flex';
        }
        function saveLocationProfile() {
            const id = document.getElementById('p-locId').value;
            const loc = currentStory.locs.find(l => l.id === id);
            loc.name = document.getElementById('p-locName').value.trim() || '未命名地點';
            loc.region = document.getElementById('p-locRegion').value.trim();
            loc.color = document.getElementById('p-locColor').value;
            loc.geo = document.getElementById('p-locGeo').value.trim();
            loc.func = document.getElementById('p-locFunc').value.trim();
            closeModal('locProfileModal');
            currentStory.updatedAt = Date.now(); saveGlobal(); renderLocationRow();
        }
        function deleteLocationProfile() {
            const id = document.getElementById('p-locId').value;
            if(confirm('刪除此地點？')) {
                currentStory.locs = currentStory.locs.filter(l => l.id !== id);
                currentStory.nodes.forEach(n => { n.linkedLocs = (n.linkedLocs||[]).filter(lid => lid !== id); });
                closeModal('locProfileModal');
                currentStory.updatedAt = Date.now(); saveGlobal(); renderLocationRow();
            }
        }

        window.addEventListener('resize', () => { if(currentStory && document.getElementById('screen-workspace').style.display !== 'none') renderCharacterRow(); });
        
        initApp();
    </script>
</body>
</html>
